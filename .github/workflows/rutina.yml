# Týdenní redakční rutina Produktivni.cz
# Jednou týdně napíše dávku pěti tipů/AI novinek, rozplánuje je na pondělí až
# pátek dalšího týdne (pole `date`) a otevře jeden PR ke schválení. Postupné
# vydávání řeší web sám — viz lib/publish.ts a „fronta publikování“ v RUTINA.md.
# Chování rutiny řídí docs/RUTINA.md — změny dělejte tam.
#
# Vyžaduje repo secret ANTHROPIC_API_KEY (Settings → Secrets → Actions).

name: Redakcni rutina

on:
  schedule:
    - cron: "23 5 * * 5" # každý pátek ráno (5:23 UTC) — na schválení zbývá víkend
  workflow_dispatch: {} # ruční spuštění z GitHub UI

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  rutina:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Redakcni rutina (Claude)
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Jsi redakční rutina webu Produktivni.cz. Přečti si docs/RUTINA.md
            a přesně podle něj proveď jeden týdenní běh: projdi existující obsah
            i frontu (python3 scripts/publish-queue.py), vyhledej na internetu
            novinky, přísně je profiltruj a napiš až pět nových položek do
            content/tipy nebo content/ai ve formátu webu. Každé dej do pole
            `date` vlastní volný pracovní den následujícího týdne (pondělí až
            pátek), novinky na začátek týdne. Ověř build s naplánovanými články
            (SHOW_SCHEDULED=1 npm run build) a otevři JEDEN pull request ke
            schválení (větev rutina/obsah-RRRR-MM-DD) s tabulkou vydání. Když
            nic kvalitního nenajdeš, PR neotvírej. Nikdy netlač přímo do
            výchozí větve.
          claude_args: |
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch"
